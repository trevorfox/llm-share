name: Deploy Widget CDN

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # id-token lets the runner mint the OIDC token npm trades for publish
    # rights. No NPM_TOKEN: npm revoked classic/automation tokens in Dec 2025,
    # and write-capable granular tokens now expire every 90 days.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@trevorfox'

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build widget
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WIDGET_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      
      # Authenticates via OIDC against the trusted publisher configured on
      # npmjs.com (user trevorfox / repo llm-share / this workflow filename).
      - name: Publish to npm (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public